<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock and Countdown Timer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #2a1766, #6c4cf1);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 30px 16px;
}

.card {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(8px);
    border-radius: 22px;
    padding: 30px 36px;
    text-align: center;
    width: 100%;
    max-width: 620px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
}

h2 { font-size: 20px; font-weight: normal; opacity: 0.9; margin-bottom: 14px; }

/* ---------- Clock ---------- */
#clock {
    font-family: "Courier New", monospace;
    font-size: clamp(44px, 12vw, 84px);
    font-weight: bold;
    letter-spacing: 4px;
    color: #ffb627;
}
#date { margin-top: 8px; font-size: 18px; opacity: 0.9; }

/* ---------- Countdown ---------- */
.target { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.target input {
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
}
.target button {
    padding: 9px 18px;
    border: none;
    border-radius: 8px;
    background: #ffb627;
    color: #2a1766;
    font-weight: bold;
    cursor: pointer;
}
.target button:hover { background: #ffc757; }

.boxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.box {
    background: rgba(0, 0, 0, 0.25);
    border-radius: 14px;
    padding: 16px 6px;
}
.box strong { display: block; font-size: clamp(28px, 8vw, 46px); font-family: "Courier New", monospace; }
.box span { font-size: 14px; opacity: 0.8; }

#message { margin-top: 16px; font-size: 18px; min-height: 26px; color: #ffb627; font-weight: bold; }
</style>
</head>
<body>

<!-- Live clock -->
<div class="card">
    <h2>Current time</h2>
    <div id="clock">00:00:00</div>
    <div id="date"></div>
</div>

<!-- Countdown timer -->
<div class="card">
    <h2 id="target-title">Countdown to New Year</h2>

    <div class="target">
        <label for="target-date">Choose a date:</label>
        <input type="datetime-local" id="target-date">
        <button id="set-btn">Start countdown</button>
    </div>

    <div class="boxes">
        <div class="box"><strong id="days">00</strong><span>Days</span></div>
        <div class="box"><strong id="hours">00</strong><span>Hours</span></div>
        <div class="box"><strong id="minutes">00</strong><span>Minutes</span></div>
        <div class="box"><strong id="seconds">00</strong><span>Seconds</span></div>
    </div>
    <div id="message"></div>
</div>

<script>
// add a leading zero: 5 -> "05"
function pad(n) { return String(n).padStart(2, "0"); }

/* ---------- Live clock (HH:MM:SS) ---------- */
function updateClock() {
    const now = new Date();
    document.getElementById("clock").textContent =
        pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    document.getElementById("date").textContent = now.toLocaleDateString("en-IN", {
        weekday: "long", year: "numeric", month: "long", day: "numeric"
    });
}

/* ---------- Countdown ---------- */
// default target: next New Year (1 January, 00:00)
let target = new Date(new Date().getFullYear() + 1, 0, 1, 0, 0, 0);

function updateCountdown() {
    const diff = target - new Date();          // milliseconds left
    const msg = document.getElementById("message");

    if (diff <= 0) {
        ["days", "hours", "minutes", "seconds"].forEach(id => document.getElementById(id).textContent = "00");
        msg.textContent = "Time is up!";
        return;
    }
    msg.textContent = "";

    const totalSeconds = Math.floor(diff / 1000);
    document.getElementById("days").textContent = pad(Math.floor(totalSeconds / 86400));
    document.getElementById("hours").textContent = pad(Math.floor((totalSeconds % 86400) / 3600));
    document.getElementById("minutes").textContent = pad(Math.floor((totalSeconds % 3600) / 60));
    document.getElementById("seconds").textContent = pad(totalSeconds % 60);
}

document.getElementById("set-btn").addEventListener("click", () => {
    const value = document.getElementById("target-date").value;
    if (!value) { document.getElementById("message").textContent = "Please choose a date and time."; return; }
    target = new Date(value);
    document.getElementById("target-title").textContent = "Countdown to " + target.toLocaleString("en-IN");
    updateCountdown();
});

// run once now, then every 1 second
updateClock();
updateCountdown();
setInterval(() => { updateClock(); updateCountdown(); }, 1000);
</script>
</body>
</html>
